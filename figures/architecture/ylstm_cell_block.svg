<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2090" viewBox="0 0 1600 2090" role="img" aria-labelledby="title desc">
<title id="title">yLSTM block — restored grey paper-style schematic</title><desc id="desc">Bottom-up, single-head yLSTM HB block as implemented. Shared normalized input feeds q, unscaled k, v and input/forget preactivations, and an external SiLU output gate. Delayed raw hidden feedback is normalized before Uqkv and Uif, then added before key scaling or gate activation. Matrix memory carries C and n. A branch LayerNorm and learned scalar beta precede output projection and the residual; an enabled pre-normalized SwiGLU has its own residual.</desc>
