training:
  epochs: 128
  batch_size: 128
  dataset_size: 50000
  val_split: 0.1
  test_size: 5000
  test_seed: 43
  split_mode: disjoint
  device: auto
  log_every: 20
  early_stop_at_accuracy: 0.95
  seed: 1451051987
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip_max_norm: 1.0
  scheduler: null
  warmup_pct: null
  cosine_eta_min_ratio: null
output:
  dir: ./experiments
  save_checkpoint: true
  save_metrics: true
  checkpoint_save_last: false
  checkpoint_save_best: true
  checkpoint_interval: null
  plots:
    enabled: true
    format: pdf
    dpi: 300
wandb:
  enabled: false
  project: hybrid-sequence-models
task:
  name: mqar
  input_seq_len: 16
  vocab_size: 256
  num_kv_pairs: 4
  power_a: 0.01
  random_non_queries: true
model:
  name: hlstm
  hidden_dim: 58
  num_layers: 2
  split_ratio: 0.5
  num_heads: 1
  fusion: gate
  ffn: swiglu
  conv_kernel: 4
  hid_features: null
  fgate_bias_init: 3.0
